# homebrew-tap test — audit + install + test formulae on macOS via SSH
when:
  - event: pull_request
    path:
      - "Formula/**"
  - event: push
    branch: main
    path:
      - "Formula/**"
  - event: manual

steps:
  - name: test-macos
    image: dhi.io/alpine-base:3.24-dev@sha256:0164533a65c7d2326758ce453d0085a9f6f7542b06a7a3cc9c984a139bd46467
    environment:
      SSH_KEY:
        from_secret: mac_builder_ssh_key
    commands:
      - apk add --no-cache openssh-client bash
      - mkdir -p ~/.ssh && chmod 700 ~/.ssh
      - printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
      - ssh-keyscan -H 10.0.0.6 >> ~/.ssh/known_hosts 2>/dev/null
      - |
        ssh yaelmeya@10.0.0.6 "export CI_COMMIT_SHA='${CI_COMMIT_SHA}'; export CI_COMMIT_PULL_REQUEST='${CI_COMMIT_PULL_REQUEST:-}'; bash" <<'REMOTE_EOF'
        set -euo pipefail
        WORKDIR=$(mktemp -d)
        git clone --depth=50 "https://git.m0sh1.cc/isityael/tap.git" "$WORKDIR"
        cd "$WORKDIR"
        if [ -n "${CI_COMMIT_PULL_REQUEST:-}" ]; then
          git fetch origin "pull/${CI_COMMIT_PULL_REQUEST}/head" --depth=50
          git checkout FETCH_HEAD
        else
          git checkout "${CI_COMMIT_SHA}"
        fi
        bash "$WORKDIR/Scripts/test-macos.sh" "$WORKDIR"
        rm -rf "$WORKDIR"
        REMOTE_EOF
