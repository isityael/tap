# homebrew-tap lint — tap syntax validation + shellcheck
when:
  - event: [pull_request]
  - event: push
    branch: main
    path:
      - "Formula/**"
      - "Casks/**"
      - "Scripts/**"
      - ".woodpecker/**"
  - event: manual

steps:
  - name: tap-syntax
    depends_on: []
    image: ghcr.io/homebrew/brew:latest
    environment:
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_COLOR: "1"
      HOMEBREW_DEVELOPER: "1"
    commands:
      - brew tap-new --no-git yaelmoshi/tap
      - TAP_PATH="$(brew --repository)/Library/Taps/yaelmoshi/homebrew-tap"
      - mkdir -p "$TAP_PATH/Formula" "$TAP_PATH/Casks"
      - cp -r Formula/* "$TAP_PATH/Formula/" 2>/dev/null || true
      - cp -r Casks/* "$TAP_PATH/Casks/" 2>/dev/null || true
      - brew style "$TAP_PATH/Formula" "$TAP_PATH/Casks"

  - name: shellcheck
    depends_on: []
    image: dhi.io/alpine-base:3.24-dev
    commands:
      - apk add --no-cache --repository https://dl-cdn.alpinelinux.org/alpine/v3.24/community shellcheck grep
      - find Scripts -type f -name "*.sh" -print0 | xargs -0 shellcheck -S error
      - find .ci -type f -name "*.sh" -print0 | xargs -0 shellcheck -S error
      - sh .ci/test-woodpecker-lint.sh
      - sh .ci/test-forgejo-canonical.sh
