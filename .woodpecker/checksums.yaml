# homebrew-tap checksums — auto-update sha256 on Renovate version-bump branches
when:
  - event: push
    branch: "renovate/*"
    path:
      - "Formula/**"
      - "Casks/**"

steps:
  - name: update-checksums
    image: ghcr.io/homebrew/brew:latest@sha256:613f2f524c4d1fb8fe37dbe7a5581392c89e7865bac725bab0d8e24309ae6d7c
    environment:
      FORGEJO_TOKEN:
        from_secret: forgejo_token
    commands:
      - CHANGED=$(git diff --name-only origin/main -- 'Casks/*.rb' 'Formula/*.rb' | tr '\n' ' ')
      - |
        if [ -z "$CHANGED" ]; then
          echo "No changed formula/cask files"
          exit 0
        fi
      - 'echo "Changed files: $CHANGED"'
      - bash Scripts/update-checksums.sh $CHANGED
      - git config user.name "Woodpecker CI"
      - git config user.email "ci@m0sh1.cc"
      - 'FORGEJO_AUTH=$(printf "%s" "$CI_REPO_OWNER:$FORGEJO_TOKEN" | base64 | tr -d "\n")'
      - git remote set-url origin "https://git.m0sh1.cc/isityael/tap.git"
      - git add Formula/ Casks/
      - |
        if git diff --cached --quiet; then
          echo "No checksum changes needed"
          exit 0
        fi
      - 'git commit -m "fix: update sha256 checksums [CI SKIP]"'
      - 'git -c http.extraHeader="Authorization: Basic $FORGEJO_AUTH" push origin HEAD'
      - unset FORGEJO_AUTH
